services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/cofoundr_ai
      USE_MEMORY_MONGO: 'false'
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5000}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a long random string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cofoundr.ai}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-2}
    ports:
      - '${PORT:-5000}:5000'
    volumes:
      - uploads:/app/server/uploads

volumes:
  mongo-data:
  uploads:
